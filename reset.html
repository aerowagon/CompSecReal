<!DOCTYPE html> 
<html lang="en">
<head>
    <title>Password Reset</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/login.css">
</head>
<body>
    <header>
        <div class="logo-container"><img src="./images/white_uwec_logo.png" alt="uwec logo"></div>
    </header>
    
    <div class="custom-shape-divider-top-1760377864">
        <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" class="shape-fill"></path>
        </svg>
    </div>

    <main class="login-container">
        <noscript>Please enable scripts in your browser.</noscript>
        <div class="img-container"><img src="./images/symbol_logo.png" alt="uwec logo symbol"></div>
        <h1>Password Reset</h1>

        <form id="resetRequestForm">
            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <div class="g-recaptcha" data-sitekey="YOUR_RECAPTCHA_SITE_KEY"></div>

            <span id="messageDisplay" style="display:block; margin-top:10px;"></span>

            <button type="submit" id="resetBtn">Send Reset Link</button>
            <a href="/login" style="display:block; margin-top:15px; text-align:center;">Back to Login</a>
        </form>

    </main>

    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script>
    document.getElementById('resetRequestForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const messageDisplay = document.getElementById('messageDisplay');
        const recaptchaResponse = grecaptcha.getResponse();

        if (!recaptchaResponse) {
            messageDisplay.style.color = 'red';
            messageDisplay.textContent = "Please complete the reCAPTCHA.";
            return;
        }

        try {
            const response = await fetch('/request-password-reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email,
                    recaptcha: recaptchaResponse
                }),
            });

            const result = await response.json();

            if (response.ok) {
                messageDisplay.style.color = 'green';
                messageDisplay.textContent = result.message;
                document.getElementById('resetRequestForm').reset();
                grecaptcha.reset();
            } else {
                messageDisplay.style.color = 'red';
                messageDisplay.textContent = result.message;
            }
        } catch (err) {
            console.error('Reset request failed:', err);
            messageDisplay.style.color = 'red';
            messageDisplay.textContent = 'Failed to connect to server.';
        }
    });
    </script>
</body>
</html>
