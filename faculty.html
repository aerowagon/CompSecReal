<script>


async function loadFacultyInfo() {
    let results = null;
    try {
        console.log('fetching session');
        const res = await fetch(`/session`);
        results = await res.json();
    } catch (err) {
        console.error('Failed to get session:', err);
    }

    const sys_ID = results.id;

    if (results.status == 'true' && results.permissions == 1) {
        try {
        const res = await fetch(`/faculty-info/${sys_ID}`);
        const faculty = await res.json();

        document.getElementById('facultyName').textContent = `${faculty.f_name} ${faculty.l_name}`;
        document.getElementById('facultyID').textContent = sys_ID;
 /*       document.getElementById('facultyPhone').value = faculty.phone || ''; */
        document.getElementById('facultyEmail').value = faculty.email || '';
        document.getElementById('facultyStreet').value = faculty.address || '';
        document.getElementById('facultyCity').value = faculty.city || '';
        document.getElementById('facultyState').value = faculty.add_city || '';
        document.getElementById('facultyZip').value = faculty.zip_code || '';
        document.getElementById('usernameDisplay').textContent = `${faculty.f_name} ${faculty.l_name}`;
        document.getElementById('date').innerHTML= faculty.updated_at;

    } catch (err) {
        console.error('Failed to load faculty info:', err);
    }

    loadStudents();

    }

    else {
            console.log('switching');
            window.location.href = results.info;
    }
    
}

async function loadStudents() {
 console.log('loading students');
    try {
        const res = await fetch('/get-students');
        const students = await res.json();
        const studentList = document.getElementById('studentList');
        studentList.innerHTML = '';

        students.forEach(student => {
            const div = document.createElement('div');
            div.className = 'student-item';
            div.innerHTML = `
                <p>${student.f_name} ${student.l_name}</p>
                <button class="view-btn" data-id="${student.blugold_ID}">View</button>
            `;
            div.querySelector('.view-btn').addEventListener('click', () => {
                window.open(`editStudent.html?blugold_ID=${student.blugold_ID}`, '_blank');
            });
            studentList.appendChild(div);
        });
    } catch (err) {
        console.error('Failed to load students:', err);
    }
}

async function getID() {
            let sys_ID = null;
        try {
            const result = await fetch(`/get_id`);
            const id = await result.json();
            sys_ID = id;
        }   catch (err) {
            console.log('Failed to retrieve system ID')
        }

        return sys_ID;
}

async function logout() {
        console.log('logging out');
        try {
            console.log('logging out');
            const res = await fetch(`/logout`);
            result = await res.json();
            window.location.href = "http://localhost:3000/login.html";
            
        } catch (err) {
            console.error('Failed to get session:', err);
        }
        
    }

async function toggleEdit(button) {
    const isEditing = button.textContent === 'Edit';
    [/*'facultyPhone'*/,'facultyEmail','facultyStreet','facultyCity','facultyState','facultyZip'].forEach(id => {
        document.getElementById(id).disabled = !isEditing;
    });
    button.textContent = isEditing ? 'Save' : 'Edit';

    


    if (!isEditing) {
        const updatedInfo = {
            email: document.getElementById('facultyEmail').value.trim() || null,
            address: document.getElementById('facultyStreet').value.trim() || null,
            city: document.getElementById('facultyCity').value.trim() || null,
            add_city: document.getElementById('facultyState').value.trim() || null,
            zip_code: document.getElementById('facultyZip').value.trim() || null,
            /*phone: document.getElementById('facultyPhone').value.trim() || null */
        };

        const sys_ID = await getID();

        try {
            const res = await fetch(`/update-faculty/${sys_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedInfo)
            });

            const data = await res.json();

            if (!res.ok) {
                // Server returned error info
                alert(`Update failed: ${data.reason || data.message}`);
                return;
            }

            alert(data.message || 'Saved successfully!');
            } catch (err) {
            console.error('Failed to update faculty info:', err);
            if (err.message) {
                alert('Failed to save: ' + err.message);
            } else {
                alert('Failed to save. Please check console for details.');
            }
        }

    }
}

document.addEventListener('DOMContentLoaded', () => {
    console.log()
    const editBtn = document.querySelector('.edit-faculty-btn');
    if (editBtn) editBtn.addEventListener('click', () => toggleEdit(editBtn));
    const logoutBtn = document.querySelector('.logoutBtn');
    if (logoutBtn) logoutBtn.addEventListener('click', () => logout());

    loadFacultyInfo();
});
</script>
