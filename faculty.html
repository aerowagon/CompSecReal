            <script>
        // Fetch students from backend and display them
        async function loadStudents() {
            try {
            const res = await fetch('/get-students');
            const students = await res.json();

            const studentList = document.getElementById('studentList');
            studentList.innerHTML = ''; // clear any existing content

            students.forEach(student => {
                const studentItem = document.createElement('div');
                studentItem.className = 'student-item';

                studentItem.innerHTML = `
                <p>${student.f_name} ${student.l_name}</p>
                <button class="view-btn" data-id="${student.blugold_ID}">View</button>
                `;

                // Goto selected student
                studentItem.querySelector('.view-btn').addEventListener('click', () => {
                    window.open(`editStudent.html?blugold_ID=${student.blugold_ID}`, '_blank');
                });


                studentList.appendChild(studentItem);
            });

            } catch (err) {
            console.error('Failed to load students:', err);
            }
        }
        async function loadFacultyInfo() {
    const sys_ID = localStorage.getItem('user_sys_ID');
    if (!sys_ID) {
      console.warn('No sys_ID found in localStorage');
      return;
    }

    try {
      const res = await fetch(`/faculty-info/${sys_ID}`);
      const faculty = await res.json();

      // Populate DOM elements
      document.getElementById('facultyName').textContent = `${faculty.f_name} ${faculty.l_name}`;
      document.getElementById('facultyID').textContent = sys_ID;
      document.getElementById('facultyEmail').value = faculty.email;
      document.getElementById('facultyAddress').value = `${faculty.address || ''} ${faculty.city || ''} ${faculty.add_city || ''} ${faculty.zip_code || ''}`;
      document.getElementById('facultyPhone').value = '(Not stored yet)'; // If you decide to add phone to DB later
    } catch (err) {
      console.error('Failed to load faculty info:', err);
    }
  }

  loadFacultyInfo()

        // Run on page load
        loadFacultyInfo()
        loadStudents();
        </script>
