<section id="dashboard_container">
  <h1>Edit Student Information</h1>
  <h3>Personal Information</h3>
  <form id="editStudentForm">
    <p><strong>Name:</strong> <span id="fullName"></span></p>
    <p><strong>Email:</strong> <span id="email"></span></p>
    <p><strong>Blugold ID:</strong> <span id="blugold_ID"></span></p>
    <p><strong>Address:</strong> <span id="address"></span></p>
    <p><strong>Phone:</strong> <span id="phone">(placeholder)</span></p>

    <h3>Academic Information</h3>
    <label style="font-family: Arial, Helvetica, sans-serif;display: block; margin: 0.5rem 0; color: #2b3594; font-size: 1rem; font-weight: bold;">GPA:
      <input type="number" step="0.01" id="GPA">
    </label><br>

    <label style="font-family: Arial, Helvetica, sans-serif;display: block; margin: 0.5rem 0; color: #2b3594; font-size: 1rem; font-weight: bold;">Total Class Credits:
      <input type="number" id="total_credits" min="0">
    </label><br>

    <label style="font-family: Arial, Helvetica, sans-serif;display: block; margin: 0.5rem 0; color: #2b3594; font-size: 1rem; font-weight: bold;">Total account_balance:
      <input type="number" step="0.01" id="account_balance">
    </label><br>
    
    <label id="date"></label>
    <label id="time"></label>

    <button type="submit">Save Changes</button>
    <div id="messageBox" style="margin-top:10px;font-weight:bold;"></div>
  </form>

  <script>
    
    const urlParams = new URLSearchParams(window.location.search);
    const blugold_ID = urlParams.get('blugold_ID');

    async function checkLogin() {
      let results = null;
      try {
          const res = await fetch(`/session`);
          results = await res.json();
      } catch (err) {
          console.error('Failed to get session:', err);
      }

      if (results.status == 'true' && results.permissions == 1) {
        console.log('verified');
        return true;
      }

      else {
        return false;
      }

  }

    async function fetchStudent() {
      const res = await fetch(`/student/${blugold_ID}`);
      const student = await res.json();

      document.getElementById('fullName').textContent = `${student.f_name} ${student.l_name}`;
      document.getElementById('email').textContent = student.email;
      document.getElementById('blugold_ID').textContent = student.blugold_ID;
      document.getElementById('address').textContent = student.address;
      document.getElementById('GPA').value = student.GPA ?? '';
      document.getElementById('account_balance').value = student.account_balance ?? '';
      document.getElementById('total_credits').value = student.total_credits ?? 0;
      document.getElementById('date').innerHTML= student.updated_at;
    }

    document.getElementById('editStudentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const GPA = document.getElementById('GPA').value;
      const account_balance = document.getElementById('account_balance').value;
      const total_credits = document.getElementById('total_credits').value;
      const messageBox = document.getElementById('messageBox');

      messageBox.textContent = 'Saving...';
      messageBox.style.color = 'gray';

      try {
        const res = await fetch(`/update-student/${blugold_ID}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ GPA, account_balance, total_credits }),
        });

        const data = await res.json();

        if (!res.ok) {
          messageBox.textContent = `Update failed: ${data.reason || data.message}`;
          messageBox.style.color = 'red';

          // Highlight the field that caused the error
          if (data.reason) {
          if (data.reason.includes('GPA')) document.getElementById('GPA').style.borderColor = 'red';
          if (data.reason.includes('credits')) document.getElementById('total_credits').style.borderColor = 'red';
          if (data.reason.includes('account balance')) document.getElementById('account_balance').style.borderColor = 'red';
        }

        } else {
          messageBox.textContent = data.message || 'Update successful!';
          messageBox.style.color = 'green';

          // Reset borders
          ['GPA', 'total_credits', 'account_balance'].forEach(id => {
            document.getElementById(id).style.borderColor = '#eef3fb';
          });
        } 
      } catch (err) {
        console.error('❌ Network or script error:', err);
        messageBox.textContent = 'Network error. Please try again.';
        messageBox.style.color = 'red';
      }
    });

    if (checkLogin()) {
      fetchStudent();
    }
    else {
      window.location.href = 'http://localhost:3000/login.html';
    }
    
  </script>
  </section>
</body>
