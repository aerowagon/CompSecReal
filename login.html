    <main class="login-container">
        <noscript>Please enable scripts in your browser.</noscript>
        <div class="img-container"><img src="./images/symbol_logo.png" alt="uwec logo symbol"></div>
        <h1>Sign In</h1>
        <form>
            <label for="email">Email:</label>
            <input type="text" id="email">
            <label for="password">Password:</label>
            <input type="password" id="password">
            <span id = "passwordError" style="color:red"> </span>
            <!--<label for="loginbool">Stay Logged In:</label>-->
            <!--<input type="checkbox" id="loginbool">-->
            <button type="submit" id="loginBtn">Log In</button>
            <!--<p>Don't have an account?</p>
            <a href="./signup.html">Sign Up</a>-->
        </form>
    </main>
</body>
<script>
    document.querySelector('form').addEventListener('submit', async function (e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
            const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
        });

        const result = await response.json();

        if (response.ok) {
            alert(result.message);
            
            localStorage.setItem('user_email', result.email);
            localStorage.setItem('user_sys_ID', result.sys_ID);
            window.location.href = result.redirectTo;


        } else {
            document.getElementById('passwordError').textContent = result.message;
        }
    } catch (err) {
        console.error('Login failed:', err);
        document.getElementById('passwordError').textContent = 'Failed to connect to server.';
    }
    });

</script>
