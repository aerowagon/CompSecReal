<html lang="en">

    <link rel="stylesheet" href="./styles/dashboard.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="./images/white_uwec_logo.png" alt="uwec logo">
        </div>

    <div class="custom-shape-divider-top-1760377864">
        <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" class="shape-fill"></path>

    <section id="dashboard_container">
        <h1>Hello Blugold Student!</h1>

        <div class="dashboard-split">
            <!-- Personal Info -->
            <div class="info-card">
                <h3>Personal Information</h3>
                <p><strong>Name:</strong> <span id="studentName"></span></p>
                <p><strong>Blugold ID:</strong> <span id="blugoldID"></span></p>
<!--
               <label><strong>Phone:</strong>
                    <input type="text" id="studentPhone" disabled>
                </label>
-->
                <label><strong>Email:</strong>
                    <input type="email" id="studentEmail" disabled>
                </label>

                <label><strong>Street:</strong>
                    <input type="text" id="studentStreet" disabled>
                </label>

                <label><strong>City:</strong>
                    <input type="text" id="studentCity" disabled>
                </label>

                <label><strong>State:</strong>
                    <input type="text" id="studentState" disabled>
                </label>

                <label><strong>ZIP:</strong>
                    <input type="text" id="studentZip" name="zip_code" pattern="\d{5}" placeholder="12345" />
                </label>

                <div id="date"></div>

                <button type="button" class="edit-student-btn">Edit</button>
            </div>

            <!-- Academic Info -->
            <div class="info-card">
                <h3>Academic Information</h3>
                <p><strong>GPA:</strong> <span id="studentGPA"></span></p>
                <p><strong>Total Class Credits:</strong> <span id="studentCredits"></span></p>
                <p><strong>Account Balance:</strong> $<span id="studentBalance"></span></p>''

                <h3>Account</h3>
                <p><strong>Username:</strong> <span id="usernameDisplay"></span></p>
                <p><strong>Password:</strong> •••••••••</p>
                <button type="button" class="logoutBtn">Log Out</button>
            </div>
        </div>
    </section>

    <script>

    async function loadStudentInfo() {
        let result = null;
        try {
            const res = await fetch(`/session`);
            result = await res.json();
        } catch (err) {
            console.error('Failed to get session:', err);
        }
        

         if (result.status==='true') {
                const id = result.id;
                try {
                const res = await fetch(`/student-by-sysid/${id}`);
                const student = await res.json();
                console.log(student);

                document.getElementById('studentName').textContent = `${student.f_name} ${student.l_name}`;
                document.getElementById('blugoldID').textContent = student.blugold_ID;
    /*            document.getElementById('studentPhone').value = student.phone || '';  */
                document.getElementById('studentEmail').value = student.email || '';
                document.getElementById('studentStreet').value = student.address || '';
                document.getElementById('studentCity').value = student.city || '';
                document.getElementById('studentState').value = student.add_city || '';
                document.getElementById('studentZip').value = student.zip_code || '';
                document.getElementById('studentGPA').textContent = student.GPA || '0.00';
                document.getElementById('studentCredits').textContent = student.total_credits || '0';
                document.getElementById('studentBalance').textContent = student.account_balance?.toFixed(2) || '0.00';
                document.getElementById('usernameDisplay').textContent = `${student.f_name} ${student.l_name}`;
                document.getElementById('date').textContent = student.updated_at;
            } catch (err) {
                console.error('Failed to load student info:', err);
            }
        }

        else {
            console.log('switching');
            window.location.href = result.info;
        }
    }

    async function getID() {
        let sys_ID = null;
        try {
            const result = await fetch(`/get_id`);
            const id = await result.json();
            sys_ID = id;
        }   catch (err) {
            console.log('Failed to retrieve system ID')
        }

        return sys_ID;
    }

    async function toggleEdit(button) {
        const isEditing = button.textContent === 'Edit';
        ['studentStreet', 'studentCity', 'studentState', 'studentZip']
            .forEach(id => document.getElementById(id).disabled = !isEditing);

        document.getElementById('studentEmail').disabled = true;

        button.textContent = isEditing ? 'Save' : 'Edit';

        const sys_ID = await getID();
        

        if (!isEditing) {
            
            const updatedInfo = {
                email: document.getElementById('studentEmail').value.trim() || null,
                address: document.getElementById('studentStreet').value.trim() || null,
                city: document.getElementById('studentCity').value.trim() || null,
                add_city: document.getElementById('studentState').value.trim() || null,
                zip_code: parseInt(document.getElementById('studentZip').value) || null
            };
            try {
                const res = await fetch(`/update-student-info/${sys_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedInfo)
                });

                const data = await res.json();

                if (!res.ok) {
                    alert(`Failed to save: ${data.reason || data.message}`);
                } else {
                    alert(data.message || 'Saved successfully!');
                }

            } catch (err) {
                console.error('Failed to update student info:', err);
                alert('Failed to save. Please try again.');
            }
        }
    }

    async function logout() {
        
        try {
            console.log('logging out');
            const res = await fetch(`/logout`);
            result = await res.json();
            
        } catch (err) {
            console.error('Failed to get session:', err);
        }
        
    }


    document.addEventListener('DOMContentLoaded', () => {
        const editBtn = document.querySelector('.edit-student-btn');
        if (editBtn) editBtn.addEventListener('click', () => toggleEdit(editBtn));

        //set logout
        const logoutBtn = document.querySelector('.logoutBtn');
        if (logoutBtn) logoutBtn.addEventListener('click', () => logout());

        //load info
        loadStudentInfo();
    });
    </script>
</body>
</html>
