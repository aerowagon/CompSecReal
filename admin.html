  <section id="dashboard_container">
    <h1 style="text-align:center;">Create Student or Faculty</h1>

    <form id="createUserForm">
      <label for="role">Role:</label>
      <select id="role" name="role" required>
        <option value="">-- Select Role --</option>
        <option value="student">Student</option>
        <option value="faculty">Faculty</option>
      </select>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required placeholder="example@uwec.edu" />

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required />

      <label for="f_name">First Name:</label>
      <input type="text" id="f_name" name="f_name" required />

      <label for="l_name">Last Name:</label>
      <input type="text" id="l_name" name="l_name" required />

      <label for="address">Street Address:</label>
      <input type="text" id="address" name="address" required />

      <label for="city">City:</label>
      <input type="text" id="city" name="city" required />

      <label for="add_city">State:</label>
      <input type="text" id="add_city" name="add_city" required maxlength="2" placeholder="WI" />

      <label for="zip_code">ZIP Code:</label>
      <input type="number" id="zip_code" name="zip_code" required />

      <button type="submit">Create Account</button>
      <div id="message" class="message"></div>
    </form>
  </section>

  <script>
    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value.trim(),
        f_name: document.getElementById('f_name').value.trim(),
        l_name: document.getElementById('l_name').value.trim(),
        address: document.getElementById('address').value.trim(),
        city: document.getElementById('city').value.trim(),
        add_city: document.getElementById('add_city').value.trim(),
        zip_code: parseInt(document.getElementById('zip_code').value),
        role: document.getElementById('role').value
      };

      const messageDiv = document.getElementById('message');
      messageDiv.textContent = 'Creating user...';

      try {
        const res = await fetch('/add-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });
        const data = await res.json();

        if (res.ok) {
          messageDiv.style.color = 'green';
          messageDiv.textContent = data.message || 'User successfully added!';
          e.target.reset();
        } else {
          messageDiv.style.color = 'red';
          messageDiv.textContent = data.message || 'Error creating user.';
        }
      } catch (err) {
        console.error('Error submitting form:', err);
        messageDiv.style.color = 'red';
        messageDiv.textContent = 'Server error. Please try again.';
      }
    });
  </script>
